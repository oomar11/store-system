<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1473e6" />
    <title>تحديث ويندور</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Segoe UI, Tahoma, sans-serif;
        background: #1473e6;
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      p {
        max-width: 22rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>ويندور</h1>
      <p>جاري تحديث نسخة الموبايل ومسح الكاش القديم…</p>
    </div>
    <script>
      (async () => {
        try {
          localStorage.setItem("windoor-cache-version", "windoor-v27");
        } catch (e) {}
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
        } catch (e) {}
        try {
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
        } catch (e) {}
        location.replace("/m?fresh=" + Date.now());
      })();
    </script>
  </body>
</html>
